name: Linux build and checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]
    runs-on: ubuntu-${{ matrix.ubuntu }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Native development dependencies
        run: ./scripts/install-system-deps.sh
      - name: Pinned Rust
        run: ./scripts/install-rust.sh
      - name: Format, lint, tests and release build
        run: ./scripts/check.sh
      - name: Shared wire fixture
        run: ./scripts/verify-protocol-fixtures.sh
      - name: Synthetic encrypted media and recovery
        run: ./target/release/titan-bench > build-synthetic-report.json
      - name: Package receiver
        run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TitanCam-Linux-ubuntu${{ matrix.ubuntu }}-x86_64
          path: |
            build/package/*
            build-synthetic-report.json
          if-no-files-found: error

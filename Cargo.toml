[workspace]
members = ["crates/titan-protocol", "crates/titan-usb", "crates/titan-media", "crates/titan-transport", "crates/titan-receiver", "crates/titan-bench"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
bytes = "1.10"
tokio = { version = "1.47", features = ["full"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gstreamer = { version = "0.24", features = ["v1_24"] }
gstreamer-app = { version = "0.24", features = ["v1_24"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = "0.13"
ed25519-dalek = "2.2"
x509-parser = "0.18"
cc = "1.2"
libc = "0.2"

name: TitanCam
options:
  deploymentTarget:
    iOS: '17.4'
  xcodeVersion: '16.4'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    PRODUCT_BUNDLE_IDENTIFIER: com.ashrafmostafasec.titancam
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '3'
    TARGETED_DEVICE_FAMILY: '1'
    HEADER_SEARCH_PATHS: '$(SRCROOT)/../build/opus-headers'
targets:
  TitanCam:
    type: application
    platform: iOS
    sources:
      - path: TitanCam
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: TitanCam/Capture/OpusBridge.h
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: TitanCam/Info.plist
      properties:
        CFBundleDisplayName: TitanCam
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Stream your camera to your Linux computer.
        NSMicrophoneUsageDescription: Stream your microphone to your Linux computer.
        NSBonjourServices: [_titancam._tcp]
        NSLocalNetworkUsageDescription: Find and connect to your camera receiver on the local network.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: TitanCam local connection
            CFBundleURLSchemes: [titancam]
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - framework: ../build/Opus.xcframework
        embed: false
  TitanCamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TitanCamTests
      - path: ../protocol/media-header-v1.bin
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TitanCam
schemes:
  TitanCam:
    build:
      targets:
        TitanCam: all
        TitanCamTests: [test]
    test:
      targets: [TitanCamTests]
      gatherCoverageData: true

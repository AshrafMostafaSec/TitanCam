name: TitanCam
options:
  deploymentTarget:
    iOS: '17.4'
  xcodeVersion: '16.4'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    PRODUCT_BUNDLE_IDENTIFIER: com.ashrafmostafasec.titancam
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1'
    HEADER_SEARCH_PATHS: '$(SRCROOT)/../build/opus-headers'
packages:
  Certificates:
    url: https://github.com/apple/swift-certificates.git
    exactVersion: 1.9.0
  ASN1:
    url: https://github.com/apple/swift-asn1.git
    exactVersion: 1.3.1
  Crypto:
    url: https://github.com/apple/swift-crypto.git
    exactVersion: 3.12.3
targets:
  TitanCam:
    type: application
    platform: iOS
    sources:
      - path: TitanCam
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: TitanCam/Capture/OpusBridge.h
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: TitanCam/Info.plist
      properties:
        CFBundleDisplayName: TitanCam
        NSCameraUsageDescription: Stream your camera to your paired Linux computer.
        NSMicrophoneUsageDescription: Stream your microphone to your paired Linux computer.
        NSLocalNetworkUsageDescription: Connect securely to your paired camera receiver on the local network.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: TitanCam pairing
            CFBundleURLSchemes: [titancam]
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - package: Certificates
        product: X509
      - package: ASN1
        product: SwiftASN1
      - framework: ../build/Opus.xcframework
        embed: false
  TitanCamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TitanCamTests
      - path: ../protocol/media-header-v1.bin
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TitanCam
schemes:
  TitanCam:
    build:
      targets:
        TitanCam: all
        TitanCamTests: [test]
    test:
      targets: [TitanCamTests]
      gatherCoverageData: true
